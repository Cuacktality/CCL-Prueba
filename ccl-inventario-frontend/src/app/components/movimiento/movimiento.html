<div class="page">
  <div class="header">
    <h2>Registrar Movimiento</h2>
    <button class="btn-secondary" (click)="irAInventario()">Ver Inventario</button>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Producto *</label>
      <select [(ngModel)]="productoId">
        <option [ngValue]="null" disabled>Seleccione un producto</option>
        <option *ngFor="let p of productos" [value]="p.id">
          {{ p.nombre }} (stock: {{ p.cantidad }})
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Tipo de movimiento *</label>
      <select [(ngModel)]="tipo">
        <option value="" disabled>Seleccione el tipo de movimiento</option>
        <option value="entrada">Entrada</option>
        <option value="salida">Salida</option>
      </select>
    </div>

    <div class="form-group">
      <label>Cantidad *</label>
      <input type="number" [(ngModel)]="cantidad" placeholder="0" min="1" />
    </div>

    <p class="success" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <button (click)="registrar()" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Registrar Movimiento' }}
    </button>
  </div>
</div>
